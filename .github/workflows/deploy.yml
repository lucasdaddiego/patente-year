name: deploy
on:
  push:
    branches: [master]
  pull_request:
  # Redeploy the current master without an empty commit — needed when the
  # deploy itself has to be re-run (rotated token, a Cloudflare-side failure).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same branch makes the older test run pointless.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm test
  deploy:
    needs: test
    # Pushes to master and manual redeploys; never a pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # Deploys queue up; an in-flight deploy is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # The deploy itself (checkout, Node, `npm run build`, wrangler) is the reusable
    # lucasdaddiego/.github cloudflare-deploy workflow. @main on purpose: my own
    # public repo, and the actions are SHA-pinned there.
    uses: lucasdaddiego/.github/.github/workflows/cloudflare-deploy.yml@main
    with:
      # No dependencies and no lockfile: nothing to install.
      install: ""
      build: npm run build
      wrangler-command: pages deploy public --project-name=patente-year --branch=master
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is a repo secret here (no repo variable exists yet), so it
      # travels under `secrets:` instead of the account-id input.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
